680 462.4l65 34v130l-65-34z" fill="#41565c"/><path d="M576 548L664 490.4" stroke="#9df4d6" stroke-width="2"/><path d="M1080 240l140 -67.2v130l-140 67.2z" fill="#556a6b"/><path d="M1080 240l140 -67.2 65 34 -140 67.2z" fill="#a5b2a9"/><path d="M1220 172.8l65 34v130l-65-34z" fill="#41565c"/><path d="M1096 268L1204 200.8" stroke="#9df4d6" stroke-width="2"/><ellipse cx="640" cy="435" rx="17" ry="8" fill="#061218" opacity=".5"/><g class="ui-icon" transform="translate(628 404) scale(1.0)" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 8 19-8-5-8 5z"/></g></g><g class="panel-fill"><rect x="208" y="390" width="864" height="310" rx="8" fill="#07131c" /></g><g class="panel-border"><rect x="208.5" y="390.5" width="863" height="309" rx="8" fill="none" stroke="#79929b"/><path d="M224 391H254" stroke="#b6d9ff" stroke-width="3"/></g><text x="228" y="423" fill="#b6d9ff" font-size="18" font-weight="700" text-anchor="start" data-max-width="824">현장 대화 / 진행 일시정지</text><g class="ui-icon" transform="translate(232 440) scale(1.0)" fill="none" stroke="#b6d9ff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18v13H9l-5 4v-4H3zM7 9h10M7 13h6"/></g><text x="270" y="462" fill="#ffffff" font-size="20" font-weight="700" text-anchor="start" data-max-width="575">헤일로 외곽 수신망 담당자 · 리아</text><rect x="865" y="436" width="183" height="28" rx="4" fill="#10242d" /><text x="877" y="455" fill="#b6d9ff" font-size="14" font-weight="700" text-anchor="start" data-max-width="163">현장 대화</text><text x="232" y="502" fill="#ffffff" font-size="20" font-weight="400" text-anchor="start" data-max-width="816">관문 N-0의 신호와 외곽 설비 N-0/17의 기록은 서로 달라.</text><text x="232" y="534" fill="#ffffff" font-size="20" font-weight="400" text-anchor="start" data-max-width="816">같은 장소로 보고 조사하면 안 돼. 먼저 발전기의 기록을 확인하자.</text><text x="232" y="566" fill="#ffffff" font-size="20" font-weight="400" text-anchor="start" data-max-width="816">확인하지 못한 내용은 조사 기