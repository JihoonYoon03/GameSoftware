<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><filter id="hud-shadow" x="-100%" y="-100%" width="300%" height="300%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="1"/></filter></defs><style>text{font-family:"Malgun Gothic",sans-serif}text,.ui-icon{opacity:var(--content-opacity,1)}[data-hud]{opacity:var(--content-opacity,1)}[data-hud] text,[data-hud] .ui-icon{opacity:1}.panel-fill{opacity:var(--panel-opacity,.94)}.panel-border{opacity:var(--border-opacity,1)}</style><rect x="0" y="0" width="1280" height="800" rx="0" fill="#07131c" /><text x="72" y="97" fill="#9df4d6" font-size="14" font-weight="700" text-anchor="start">HUD / 01</text><text x="72" y="143" fill="#ffffff" font-size="32" font-weight="700" text-anchor="start">게이지 · 아이콘 · 필요한 수치만 표시합니다.</text><text x="72" y="174" fill="#d0dfe3" font-size="16" font-weight="400" text-anchor="start" data-max-width="1120">체력·탄약·수배·스캐너·속도에 독립 패널을 사용하지 않습니다.</text><g class="hud-symbol" transform="translate(88 252) scale(1.3333333333333333)" fill="none" stroke-linecap="round" stroke-linejoin="round"><g stroke="#02080d" stroke-width="5.5"><path d="M12 5v14M5 12h14"/></g><g class="ui-icon" stroke="#9df4d6" stroke-width="2.1" fill="none"><path d="M12 5v14M5 12h14"/></g></g><g class="hud-text" paint-order="stroke fill" stroke="#02080d" stroke-width="4" stroke-linejoin="round"><text x="142" y="280" fill="#9df4d6" font-size="28" font-weight="700" text-anchor="start">86 / 100</text></g><rect x="140" y="298" width="224" height="16" rx="3" fill="#02080d" /><rect x="142" y="300" width="220" height="12" rx="6.0" fill="#354b54" /><rect x="142" y="300" width="189.2" height="12" rx="6.0" fill="#9df4d6" /><text x="88" y="359" fill="#ffffff" font-size="20" font-weight="400" text-anchor="start" data-max-width="480">체력 · 현재/최대 + 가로 게이지</text><g class="hud-symbol" transform="translate(710 252) scale(1.3333333333333333)" fill="none" stroke-linecap="round" stroke-linejo