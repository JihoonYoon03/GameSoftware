rx="6" fill="#132830" /><g class="ui-icon" transform="translate(112 535) scale(1.0)" fill="none" stroke="#d4e1e4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18v16H3zM3 9h18M8 4v16M12 13l5 2-5 3z"/></g><text x="150" y="553" fill="#f4f6f1" font-size="18" font-weight="600" text-anchor="start" data-max-width="474">1장 · 빛나는 개척지 시작</text><text x="730" y="553" fill="#a6e6cf" font-size="16" font-weight="500" text-anchor="end">06</text><path d="M780 211L780 567" stroke="#2e4852" stroke-width="1"/><g class="ui-icon" transform="translate(824 222) scale(1.5)" fill="none" stroke="#a6e6cf" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h17v6H10l-2 7H4l2-9H3zM15 7v4M11 12v3h3v-3"/></g><text x="824" y="306" fill="#f4f6f1" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">권총 해금 · 광산 입구</text><text x="824" y="360" fill="#d4e1e4" font-size="18" font-weight="400" text-anchor="start" data-max-width="328">광산 입구 야외에서 시작합니다. 권총을 </text><text x="824" y="388" fill="#d4e1e4" font-size="18" font-weight="400" text-anchor="start" data-max-width="328">보유하지만 기본 장착은 맨손입니다.</text><text x="96" y="636" fill="#ffe1a6" font-size="18" font-weight="400" text-anchor="start" data-max-width="1088">선택 시 현재 진행이 초기화됩니다. 이전 필수 스토리는 완료 처리됩니다.</text><rect x="96" y="678" width="170" height="52" rx="6" fill="#132830" /><g class="ui-icon" transform="translate(112 692) scale(1.0)" fill="none" stroke="#d4e1e4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m8 4 8 8-8 8"/></g><text x="150" y="710" fill="#f4f6f1" font-size="18" font-weight="600" text-anchor="start" data-max-width="92">뒤로</text><text x="1176" y="711" fill="#d4e1e4" font-size="16" font-weight="400" text-anchor="end" data-max-width="840">W/S · 방향 키 이동   Enter 선택   Esc 뒤로</text></svg>