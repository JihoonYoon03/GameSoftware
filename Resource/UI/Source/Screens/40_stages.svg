<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><filter id="hud-shadow" x="-100%" y="-100%" width="300%" height="300%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="1"/></filter></defs><style>text{font-family:"Malgun Gothic",sans-serif}text,.ui-icon{opacity:var(--content-opacity,1)}[data-hud]{opacity:var(--content-opacity,1)}[data-hud] text,[data-hud] .ui-icon{opacity:1}.panel-fill{opacity:var(--panel-opacity,.94)}.panel-border{opacity:var(--border-opacity,1)}</style><rect x="0" y="0" width="1280" height="800" rx="0" fill="#0a1821" /><g class="panel-fill"><rect x="64" y="48" width="1152" height="704" rx="10" fill="#0a1821" /></g><g class="panel-border"><rect x="64.5" y="48.5" width="1151" height="703" rx="10" fill="none" stroke="#65818c" stroke-opacity=".65"/><path d="M84 49H120" stroke="#a6e6cf" stroke-width="2"/></g><text x="96" y="86" fill="#a6e6cf" font-size="16" font-weight="600" text-anchor="start">테스트 진입</text><text x="96" y="132" fill="#f4f6f1" font-size="32" font-weight="700" text-anchor="start" data-max-width="1088">스테이지 시작</text><text x="96" y="164" fill="#d4e1e4" font-size="18" font-weight="400" text-anchor="start" data-max-width="1088">시작 지점과 기능 해금 지점만 모았습니다.</text><path d="M96 186H1184" stroke="#2e4852" stroke-width="1"/><rect x="96" y="211" width="652" height="52" rx="6" fill="#132830" /><g class="ui-icon" transform="translate(112 225) scale(1.0)" fill="none" stroke="#d4e1e4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18v16H3zM3 9h18M8 4v16M12 13l5 2-5 3z"/></g><text x="150" y="243" fill="#f4f6f1" font-size="18" font-weight="600" text-anchor="start" data-max-width="474">서장 · 헤일로 시작</text><text x="730" y="243" fill="#a6e6cf" font-size="16" font-weight="500" text-anchor="end">01</text><rect x="96" y="273" width="652" height="52" rx="6" fill="#132830" /><g class="ui-icon" transform="translate(112 287) scale(1.0)" fill="none" stroke="#d4e1e