<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><filter id="hud-shadow" x="-100%" y="-100%" width="300%" height="300%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="1"/></filter></defs><style>text{font-family:"Malgun Gothic",sans-serif}text,.ui-icon{opacity:var(--content-opacity,1)}[data-hud]{opacity:var(--content-opacity,1)}[data-hud] text,[data-hud] .ui-icon{opacity:1}.panel-fill{opacity:var(--panel-opacity,.94)}.panel-border{opacity:var(--border-opacity,1)}</style><rect x="0" y="0" width="1280" height="800" rx="0" fill="#0a1821" /><g class="panel-fill"><rect x="64" y="48" width="1152" height="704" rx="10" fill="#0a1821" /></g><g class="panel-border"><rect x="64.5" y="48.5" width="1151" height="703" rx="10" fill="none" stroke="#65818c" stroke-opacity=".65"/><path d="M84 49H120" stroke="#a6e6cf" stroke-width="2"/></g><text x="96" y="86" fill="#a6e6cf" font-size="16" font-weight="600" text-anchor="start">기록실</text><text x="96" y="132" fill="#f4f6f1" font-size="32" font-weight="700" text-anchor="start" data-max-width="1088">조사 기록</text><text x="96" y="164" fill="#d4e1e4" font-size="18" font-weight="400" text-anchor="start" data-max-width="1088">확인한 사실과 다음 행동을 구분합니다.</text><path d="M96 186H1184" stroke="#2e4852" stroke-width="1"/><rect x="96" y="210" width="290" height="52" rx="6" fill="#223e46" /><rect x="96" y="220" width="3" height="32" rx="1" fill="#a6e6cf" /><g class="ui-icon" transform="translate(112 224) scale(1.0)" fill="none" stroke="#a6e6cf" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18H6zM9 7h6M9 11h6M9 15h4"/></g><text x="150" y="242" fill="#f4f6f1" font-size="18" font-weight="600" text-anchor="start" data-max-width="212">관문 N-0의 수신 기록</text><rect x="96" y="272" width="290" height="52" rx="6" fill="#132830" /><g class="ui-icon" transform="translate(112 286) scale(1.0)" fill="none" stroke="#d4e1e4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10M6 5a9 9 0 1 0 12 0"/></g><text x="150" y="304" fill="#f4f6f1" font-size="18" font-weight="600" text-anchor="start" data-max-width="212">발전기 조사</text><rect x="96" y="334" width="290" height="52" rx="6" fill="#132830" /><g class="ui-icon" transform="translate(112 348) scale(1.0)" fill="none" stroke="#d4e1e4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v14H3zM8 6V3h8v3M12 10v6M9 13h6"/></g><text x="150" y="366" fill="#f4f6f1" font-size="18" font-weight="600" text-anchor="start" data-max-width="212">운송대 구조</text><path d="M418 210L418 648" stroke="#2e4852" stroke-width="1"/><text x="454" y="237" fill="#f4f6f1" font-size="24" font-weight="700" text-anchor="start" data-max-width="698">관문과 외곽 설비는 다른 대상이다.</text><text x="454" y="292" fill="#a6e6cf" font-size="16" font-weight="600" text-anchor="start">확인한 사실</text><text x="454" y="328" fill="#f4f6f1" font-size="20" font-weight="400" text-anchor="start" data-max-width="698">N-0은 관문을 가리키고 N-0/17은 외곽 설비의 식별 번호다. 아직 조사하지 </text><text x="454" y="360" fill="#f4f6f1" font-size="20" font-weight="400" text-anchor="start" data-max-width="698">않은 내용과 추정은 확인한 사실로 기록하지 않는다.</text><text x="454" y="434" fill="#a6e6cf" font-size="16" font-weight="600" text-anchor="start">현재 할 일</text><text x="454" y="473" fill="#f4f6f1" font-size="20" font-weight="400" text-anchor="start" data-max-width="698">세 현장의 기록을 대조하고, 헤일로 수신망에서 리아에게 조사 결과를 </text><text x="454" y="505" fill="#f4f6f1" font-size="20" font-weight="400" text-anchor="start" data-max-width="698">보고한다.</text><text x="454" y="619" fill="#d4e1e4" font-size="18" font-weight="400" text-anchor="start" data-max-width="698">중단한 대화는 안전한 곳에서 다시 말을 걸어 재개할 수 있습니다.</text><rect x="92" y="690" width="230" height="31" rx="4" fill="#0a1821" /><rect x="96" y="693" width="169" height="25" rx="4" fill="#142b34" stroke="#65818c"/><text x="180.5" y="710" fill="#f4f6f1" font-size="14" font-weight="700" text-anchor="middle" data-max-width="163">PageUp / PageDown</text><text x="274" y="711" fill="#d4e1e4" font-size="14" font-weight="400" text-anchor="start">페이지</text><rect x="1046" y="690" width="127" height="31" rx="4" fill="#0a1821" /><rect x="1050" y="693" width="79" height="25" rx="4" fill="#142b34" stroke="#65818c"/><text x="1089.5" y="710" fill="#f4f6f1" font-size="14" font-weight="700" text-anchor="middle" data-max-width="73">J / Esc</text><text x="1138" y="711" fill="#d4e1e4" font-size="14" font-weight="400" text-anchor="start">닫기</text></svg>