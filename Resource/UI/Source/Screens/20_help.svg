<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><filter id="hud-shadow" x="-100%" y="-100%" width="300%" height="300%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="1"/></filter></defs><style>text{font-family:"Malgun Gothic",sans-serif}text,.ui-icon{opacity:var(--content-opacity,1)}[data-hud]{opacity:var(--content-opacity,1)}[data-hud] text,[data-hud] .ui-icon{opacity:1}.panel-fill{opacity:var(--panel-opacity,.94)}.panel-border{opacity:var(--border-opacity,1)}</style><rect x="0" y="0" width="1280" height="800" rx="0" fill="#0a1821" /><g class="panel-fill"><rect x="64" y="48" width="1152" height="704" rx="10" fill="#0a1821" /></g><g class="panel-border"><rect x="64.5" y="48.5" width="1151" height="703" rx="10" fill="none" stroke="#65818c" stroke-opacity=".65"/><path d="M84 49H120" stroke="#a6e6cf" stroke-width="2"/></g><text x="96" y="86" fill="#a6e6cf" font-size="16" font-weight="600" text-anchor="start">필드 가이드</text><text x="96" y="132" fill="#f4f6f1" font-size="32" font-weight="700" text-anchor="start" data-max-width="1088">조작 안내</text><text x="96" y="164" fill="#d4e1e4" font-size="18" font-weight="400" text-anchor="start" data-max-width="1088">현재 장면에서 사용할 수 있는 동작만 안내합니다.</text><path d="M96 186H1184" stroke="#2e4852" stroke-width="1"/><text x="96" y="219" fill="#a6e6cf" font-size="18" font-weight="600" text-anchor="start" data-max-width="520">WASD</text><text x="96" y="248" fill="#f4f6f1" font-size="18" font-weight="400" text-anchor="start" data-max-width="500">이동 · 이동 방향 회전</text><text x="660" y="219" fill="#a6e6cf" font-size="18" font-weight="600" text-anchor="start" data-max-width="520">우클릭 홀드</text><text x="660" y="248" fill="#f4f6f1" font-size="18" font-weight="400" text-anchor="start" data-max-width="500">커서 조준</text><text x="96" y="295" fill="#a6e6cf" font-size="18" font-weight="600" text-anchor="start" data-max-width="520">좌클릭</text><text x="96" y="324" fill="#f4f6f1" font-size="18" font-weight="400" text-anchor="start" data-max-width="500">장착 무기 공격</text><text x="660" y="295" fill="#a6e6cf" font-size="18" font-weight="600" text-anchor="start" data-max-width="520">Q 홀드 + 마우스</text><text x="660" y="324" fill="#f4f6f1" font-size="18" font-weight="400" text-anchor="start" data-max-width="500">무기 선택 · Q 해제로 장착</text><text x="96" y="371" fill="#a6e6cf" font-size="18" font-weight="600" text-anchor="start" data-max-width="520">V / R</text><text x="96" y="400" fill="#f4f6f1" font-size="18" font-weight="400" text-anchor="start" data-max-width="500">근접 공격 / 재장전</text><text x="660" y="371" fill="#a6e6cf" font-size="18" font-weight="600" text-anchor="start" data-max-width="520">G</text><text x="660" y="400" fill="#f4f6f1" font-size="18" font-weight="400" text-anchor="start" data-max-width="500">회복 · 광산과 1장</text><text x="96" y="447" fill="#a6e6cf" font-size="18" font-weight="600" text-anchor="start" data-max-width="520">E</text><text x="96" y="476" fill="#f4f6f1" font-size="18" font-weight="400" text-anchor="start" data-max-width="500">대화 · 조사 · 승하차</text><text x="660" y="447" fill="#a6e6cf" font-size="18" font-weight="600" text-anchor="start" data-max-width="520">F / M</text><text x="660" y="476" fill="#f4f6f1" font-size="18" font-weight="400" text-anchor="start" data-max-width="500">광산 스캔 / 전체 지도</text><text x="96" y="523" fill="#a6e6cf" font-size="18" font-weight="600" text-anchor="start" data-max-width="520">J / H</text><text x="96" y="552" fill="#f4f6f1" font-size="18" font-weight="400" text-anchor="start" data-max-width="500">조사 기록 / 대사 이력</text><text x="660" y="523" fill="#a6e6cf" font-size="18" font-weight="600" text-anchor="start" data-max-width="520">Esc</text><text x="660" y="552" fill="#f4f6f1" font-size="18" font-weight="400" text-anchor="start" data-max-width="500">일시정지 · 닫기</text><path d="M96 612H1184" stroke="#2e4852" stroke-width="1"/><text x="96" y="650" fill="#d4e1e4" font-size="18" font-weight="400" text-anchor="start" data-max-width="1088">Q는 무기 선택, G는 회복입니다. 대화는 E/Enter로 다음 페이지를 읽고, 숫자로 선택한 뒤 확정합니다.</text><rect x="1056" y="696" width="91" height="31" rx="4" fill="#0a1821" /><rect x="1060" y="699" width="43" height="25" rx="4" fill="#142b34" stroke="#65818c"/><text x="1081.5" y="716" fill="#f4f6f1" font-size="14" font-weight="700" text-anchor="middle" data-max-width="37">Esc</text><text x="1112" y="717" fill="#d4e1e4" font-size="14" font-weight="400" text-anchor="start">뒤로</text></svg>