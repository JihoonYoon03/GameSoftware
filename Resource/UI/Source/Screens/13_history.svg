<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><filter id="hud-shadow" x="-100%" y="-100%" width="300%" height="300%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="1"/></filter></defs><style>text{font-family:"Malgun Gothic",sans-serif}text,.ui-icon{opacity:var(--content-opacity,1)}[data-hud]{opacity:var(--content-opacity,1)}[data-hud] text,[data-hud] .ui-icon{opacity:1}.panel-fill{opacity:var(--panel-opacity,.94)}.panel-border{opacity:var(--border-opacity,1)}</style><rect x="0" y="0" width="1280" height="800" rx="0" fill="#0a1821" /><g class="panel-fill"><rect x="64" y="48" width="1152" height="704" rx="10" fill="#0a1821" /></g><g class="panel-border"><rect x="64.5" y="48.5" width="1151" height="703" rx="10" fill="none" stroke="#65818c" stroke-opacity=".65"/><path d="M84 49H120" stroke="#a6e6cf" stroke-width="2"/></g><text x="96" y="86" fill="#a6e6cf" font-size="16" font-weight="600" text-anchor="start">기록실</text><text x="96" y="132" fill="#f4f6f1" font-size="32" font-weight="700" text-anchor="start" data-max-width="1088">대사 이력</text><text x="96" y="164" fill="#d4e1e4" font-size="18" font-weight="400" text-anchor="start" data-max-width="1088">이미 읽은 내용만 전달 방식과 함께 보관합니다.</text><path d="M96 186H1184" stroke="#2e4852" stroke-width="1"/><text x="96" y="229" fill="#a6e6cf" font-size="16" font-weight="600" text-anchor="start">무전</text><text x="246" y="229" fill="#f4f6f1" font-size="20" font-weight="600" text-anchor="start" data-max-width="900">리아</text><text x="246" y="273" fill="#f4f6f1" font-size="20" font-weight="400" text-anchor="start" data-max-width="906">수신 기록은 확인했어. 다음은 발전기야.</text><path d="M246 313H1152" stroke="#2e4852" stroke-width="1"/><text x="96" y="357" fill="#a6e6cf" font-size="16" font-weight="600" text-anchor="start">단말</text><text x="246" y="357" fill="#f4f6f1" font-size="20" font-weight="600" text-anchor="start" data-max-width="900">발전기 제어 단말</text><text x="246" y="401" fill="#f4f6f1" font-size="20" font-weight="400" text-anchor="start" data-max-width="906">보조 전력 복구를 확인했습니다.</text><path d="M246 441H1152" stroke="#2e4852" stroke-width="1"/><text x="96" y="485" fill="#a6e6cf" font-size="16" font-weight="600" text-anchor="start">현장 대화</text><text x="246" y="485" fill="#f4f6f1" font-size="20" font-weight="600" text-anchor="start" data-max-width="900">리아</text><text x="246" y="529" fill="#f4f6f1" font-size="20" font-weight="400" text-anchor="start" data-max-width="906">아직은 결론을 내리지 말자. 세 현장의 기록을 더 대조해야 해.</text><path d="M246 569H1152" stroke="#2e4852" stroke-width="1"/><rect x="92" y="690" width="230" height="31" rx="4" fill="#0a1821" /><rect x="96" y="693" width="169" height="25" rx="4" fill="#142b34" stroke="#65818c"/><text x="180.5" y="710" fill="#f4f6f1" font-size="14" font-weight="700" text-anchor="middle" data-max-width="163">PageUp / PageDown</text><text x="274" y="711" fill="#d4e1e4" font-size="14" font-weight="400" text-anchor="start">페이지</text><rect x="1046" y="690" width="127" height="31" rx="4" fill="#0a1821" /><rect x="1050" y="693" width="79" height="25" rx="4" fill="#142b34" stroke="#65818c"/><text x="1089.5" y="710" fill="#f4f6f1" font-size="14" font-weight="700" text-anchor="middle" data-max-width="73">H / Esc</text><text x="1138" y="711" fill="#d4e1e4" font-size="14" font-weight="400" text-anchor="start">닫기</text></svg>