<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><filter id="hud-shadow" x="-100%" y="-100%" width="300%" height="300%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="1"/></filter></defs><style>text{font-family:"Malgun Gothic",sans-serif}text,.ui-icon{opacity:var(--content-opacity,1)}[data-hud]{opacity:var(--content-opacity,1)}[data-hud] text,[data-hud] .ui-icon{opacity:1}.panel-fill{opacity:var(--panel-opacity,.94)}.panel-border{opacity:var(--border-opacity,1)}</style><rect x="0" y="0" width="1280" height="800" rx="0" fill="#0a1821" /><text x="72" y="97" fill="#a6e6cf" font-size="14" font-weight="700" text-anchor="start">TYPE VALIDATION / 06</text><text x="72" y="143" fill="#f4f6f1" font-size="32" font-weight="700" text-anchor="start">긴 이름 · 긴 문장 · 큰 수치 검토</text><text x="72" y="174" fill="#d4e1e4" font-size="16" font-weight="400" text-anchor="start" data-max-width="1120">실제 맑은 고딕 글리프 폭으로 검사하고, 길이가 넘으면 줄바꿈·페이지 분리를 적용합니다.</text><g class="panel-fill"><rect x="64" y="214" width="1152" height="336" rx="10" fill="#0a1821" /></g><g class="panel-border"><rect x="64.5" y="214.5" width="1151" height="335" rx="10" fill="none" stroke="#65818c" stroke-opacity=".65"/><path d="M84 215H120" stroke="#a6e6cf" stroke-width="2"/></g><text x="84" y="247" fill="#a6e6cf" font-size="18" font-weight="700" text-anchor="start" data-max-width="1112">헤일로 외곽 수신망 통신·보안·의료 지원 담당자 / 긴 화자명 예시</text><text x="88" y="308" fill="#f4f6f1" font-size="20" font-weight="400" text-anchor="start" data-max-width="1104">N-0 관문과 N-0/17 외곽 설비는 서로 다른 대상입니다. 확인한 내용만 조사 기록에 남깁니다.</text><text x="88" y="342" fill="#f4f6f1" font-size="20" font-weight="400" text-anchor="start" data-max-width="1104">확인하지 못한 내용은 추정으로 남기고, 안전한 곳에서 중단된 대화를 다시 읽으세요.</text><text x="88" y="376" fill="#f4f6f1" font-size="20" font-weight="400" text-anchor="start" data-max-width="1104">가까이 다가가 기록을 대조한 다음, 헤일로 수신망에서 조사 결과를 보고한다.</text><rect x="88" y="436" width="1104" height="46" rx="5" fill="#203c46" /><rect x="88" y="436" width="3" height="46" rx="0" fill="#a6e6cf" /><g class="ui-icon" transform="translate(100 448) scale(0.875)" fill="none" stroke="#a6e6cf" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m8 4 8 8-8 8"/></g><text x="132" y="465" fill="#a6e6cf" font-size="16" font-weight="700" text-anchor="start" data-max-width="1024">1  기록을 끝까지 읽고, 세 현장의 조사 결과를 확인한 뒤 헤일로 수신망에서 리아와 대조한다.</text><text x="88" y="524" fill="#d4e1e4" font-size="18" font-weight="400" text-anchor="start" data-max-width="1104">가나다라마바사아자차카타파하 ABC xyz 0123456789 / · - → ↗ ★ ☆ △ ½ ¼</text><g class="panel-fill"><rect x="64" y="582" width="1152" height="148" rx="10" fill="#0a1821" /></g><g class="panel-border"><rect x="64.5" y="582.5" width="1151" height="147" rx="10" fill="none" stroke="#65818c" stroke-opacity=".65"/><path d="M84 583H120" stroke="#a6e6cf" stroke-width="2"/></g><text x="88" y="632" fill="#f4f6f1" font-size="24" font-weight="700" text-anchor="start" data-max-width="410">체력 9,999 / 9,999</text><text x="724" y="632" fill="#f4f6f1" font-size="24" font-weight="700" text-anchor="start" data-max-width="468">크레딧 999,999,999</text><text x="88" y="686" fill="#f4f6f1" font-size="22" font-weight="400" text-anchor="start" data-max-width="550">경험치 999,999 / 999,999</text><text x="724" y="686" fill="#f4f6f1" font-size="22" font-weight="400" text-anchor="start" data-max-width="468">부품 999,999 · 회복 키트 999</text></svg>