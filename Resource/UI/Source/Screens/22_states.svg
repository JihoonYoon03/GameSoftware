<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><filter id="hud-shadow" x="-100%" y="-100%" width="300%" height="300%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="1"/></filter></defs><style>text{font-family:"Malgun Gothic",sans-serif}text,.ui-icon{opacity:var(--content-opacity,1)}[data-hud]{opacity:var(--content-opacity,1)}[data-hud] text,[data-hud] .ui-icon{opacity:1}.panel-fill{opacity:var(--panel-opacity,.94)}.panel-border{opacity:var(--border-opacity,1)}</style><rect x="0" y="0" width="1280" height="800" rx="0" fill="#0a1821" /><text x="72" y="97" fill="#a6e6cf" font-size="14" font-weight="700" text-anchor="start">STATES / 02</text><text x="72" y="143" fill="#f4f6f1" font-size="32" font-weight="700" text-anchor="start">상황별 상태와 입력 안내</text><text x="72" y="174" fill="#d4e1e4" font-size="16" font-weight="400" text-anchor="start" data-max-width="1120">샘플 수치는 상태 검토용이며 게임에서 받은 값으로 교체합니다.</text><text x="72" y="250" fill="#a6e6cf" font-size="16" font-weight="700" text-anchor="start" data-max-width="140">스캐너</text><rect x="220" y="226" width="185" height="55" rx="5" fill="#142b34" /><text x="232" y="258" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">F 사용 가능</text><rect x="417" y="226" width="185" height="55" rx="5" fill="#142b34" /><text x="429" y="258" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">스캔 진행</text><rect x="614" y="226" width="185" height="55" rx="5" fill="#142b34" /><text x="626" y="258" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">충전 대기 4.2초</text><rect x="811" y="226" width="185" height="55" rx="5" fill="#142b34" /><text x="823" y="258" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">신호 발견</text><rect x="1008" y="226" width="185" height="55" rx="5" fill="#142b34" /><text x="1020" y="258" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">감지된 신호 없음</text><text x="72" y="333" fill="#a6e6cf" font-size="16" font-weight="700" text-anchor="start" data-max-width="140">권총</text><rect x="220" y="309" width="185" height="55" rx="5" fill="#142b34" /><text x="232" y="341" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">8 / 12 · 사격 가능</text><rect x="417" y="309" width="185" height="55" rx="5" fill="#142b34" /><text x="429" y="341" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">0 / 12 · 탄창 소진</text><rect x="614" y="309" width="185" height="55" rx="5" fill="#142b34" /><text x="626" y="341" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">재장전 중</text><rect x="811" y="309" width="185" height="55" rx="5" fill="#142b34" /><text x="823" y="341" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">재장전 완료</text><rect x="1008" y="309" width="185" height="55" rx="5" fill="#142b34" /><text x="1020" y="341" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">예비 탄창 무제한</text><text x="72" y="416" fill="#a6e6cf" font-size="16" font-weight="700" text-anchor="start" data-max-width="140">동료 · 구조</text><rect x="220" y="392" width="185" height="55" rx="5" fill="#142b34" /><text x="232" y="424" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">리아 · 동행</text><rect x="417" y="392" width="185" height="55" rx="5" fill="#142b34" /><text x="429" y="424" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">중상 · 회복 중</text><rect x="614" y="392" width="185" height="55" rx="5" fill="#142b34" /><text x="626" y="424" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">구조 확인</text><rect x="811" y="392" width="185" height="55" rx="5" fill="#142b34" /><text x="823" y="424" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">철수 중</text><rect x="1008" y="392" width="185" height="55" rx="5" fill="#142b34" /><text x="1020" y="424" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">안전 지점 도착</text><text x="72" y="499" fill="#a6e6cf" font-size="16" font-weight="700" text-anchor="start" data-max-width="140">보급 교환</text><rect x="220" y="475" width="185" height="55" rx="5" fill="#142b34" /><text x="232" y="507" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">교환 가능</text><rect x="417" y="475" width="185" height="55" rx="5" fill="#142b34" /><text x="429" y="507" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">부품 부족</text><rect x="614" y="475" width="185" height="55" rx="5" fill="#142b34" /><text x="626" y="507" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">보유 상한</text><rect x="811" y="475" width="185" height="55" rx="5" fill="#142b34" /><text x="823" y="507" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">교환 완료</text><rect x="1008" y="475" width="185" height="55" rx="5" fill="#142b34" /><text x="1020" y="507" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">평판 할증 적용</text><text x="72" y="582" fill="#a6e6cf" font-size="16" font-weight="700" text-anchor="start" data-max-width="140">주행 · 교통</text><rect x="220" y="558" width="185" height="55" rx="5" fill="#142b34" /><text x="232" y="590" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">정차 · E 하차</text><rect x="417" y="558" width="185" height="55" rx="5" fill="#142b34" /><text x="429" y="590" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">부스트 중</text><rect x="614" y="558" width="185" height="55" rx="5" fill="#142b34" /><text x="626" y="590" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">후진 1 km/h</text><rect x="811" y="558" width="185" height="55" rx="5" fill="#142b34" /><text x="823" y="590" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">보행 대기</text><rect x="1008" y="558" width="185" height="55" rx="5" fill="#142b34" /><text x="1020" y="590" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">차량 충돌 · 체력 -8</text><text x="72" y="665" fill="#a6e6cf" font-size="16" font-weight="700" text-anchor="start" data-max-width="140">대화 전달</text><rect x="220" y="641" width="185" height="55" rx="5" fill="#142b34" /><text x="232" y="673" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">현장 대화</text><rect x="417" y="641" width="185" height="55" rx="5" fill="#142b34" /><text x="429" y="673" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">무전 · 전투 계속</text><rect x="614" y="641" width="185" height="55" rx="5" fill="#142b34" /><text x="626" y="673" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">단말 메시지</text><rect x="811" y="641" width="185" height="55" rx="5" fill="#142b34" /><text x="823" y="673" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">수신 기록</text><rect x="1008" y="641" width="185" height="55" rx="5" fill="#142b34" /><text x="1020" y="673" fill="#f4f6f1" font-size="14" font-weight="400" text-anchor="start" data-max-width="162">이송 중 입력 불가</text><text x="640" y="780" fill="#d4e1e4" font-size="14" font-weight="400" text-anchor="middle" data-max-width="1100">수배 0–5단계 · 현재 추격은 열도 / 도시 간 남는 기록은 악명으로 구분</text></svg>