<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><style>text{font-family:"Malgun Gothic",sans-serif}text,.ui-icon{opacity:var(--content-opacity,1)} .panel-fill{opacity:var(--panel-opacity,.94)} .panel-border{opacity:var(--border-opacity,1)}</style><g class="world-background"><rect x="0" y="0" width="1280" height="800" rx="0" fill="#080e14" /><path d="m160 190 116-55 87 72-114 58z" fill="#202d32" stroke="#334149"/><path d="m293 248 116-55 87 72-114 58z" fill="#202d32" stroke="#334149"/><path d="m426 306 116-55 87 72-114 58z" fill="#202d32" stroke="#334149"/><path d="m559 190 116-55 87 72-114 58z" fill="#202d32" stroke="#334149"/><path d="m692 248 116-55 87 72-114 58z" fill="#202d32" stroke="#334149"/><path d="m825 306 116-55 87 72-114 58z" fill="#202d32" stroke="#334149"/><path d="m958 190 116-55 87 72-114 58z" fill="#202d32" stroke="#334149"/><path d="M210 650 440 520 610 610 880 460 1050 550" fill="none" stroke="#30464c" stroke-width="76"/><path d="M210 650 440 520 610 610 880 460 1050 550" fill="none" stroke="#42716d" stroke-width="2"/><ellipse cx="640" cy="435" rx="17" ry="8" fill="#061218" opacity=".5"/><g class="ui-icon" transform="translate(628 404) scale(1.0)" fill="none" stroke="#eef5ef" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 8 19-8-5-8 5z"/></g></g><g class="panel-fill"><rect x="32" y="32" width="336" height="132" rx="8" fill="#0b1720" /></g><g class="panel-border"><rect x="32.5" y="32.5" width="335" height="131" rx="8" fill="none" stroke="#54717b"/><path d="M48 33H78" stroke="#86e2ce" stroke-width="3"/></g><text x="52" y="65" fill="#86e2ce" font-size="17" font-weight="700" text-anchor="start" data-max-width="296">현재 목표</text><text x="52" y="89" fill="#b8cdcf" font-size="13" font-weight="400" text-anchor="start" data-max-width="296">광산 / 반복 구조</text><text x="52" y="119" fill="#eef5ef" font-size="16" font-weight="700" text-anchor="start" data-max-width="296">광산의 구조 신호를 조사</text><text x="52" y="145" fill="#b8cdcf" font-size="13" font-weight="400" text-anchor="start" data-max-width="296">F 스캔으로 신호를 감지하세요.</text><g class="panel-fill"><rect x="1040" y="32" width="208" height="264" rx="8" fill="#0b1720" /></g><g class="panel-border"><rect x="1040.5" y="32.5" width="207" height="263" rx="8" fill="none" stroke="#54717b"/><path d="M1056 33H1086" stroke="#86e2ce" stroke-width="3"/></g><defs><clipPath id="miniclip"><circle cx="1144" cy="139" r="82"/></clipPath></defs><g clip-path="url(#miniclip)"><rect x="1062" y="57" width="164" height="164" rx="0" fill="#182e37" /><path d="M1080 185 1134 155 1160 170 1210 130" stroke="#658888" stroke-width="24" fill="none"/><text x="1155" y="98" fill="#8d9fa5" font-size="12" font-weight="400" text-anchor="start">미탐험</text></g><circle cx="1144" cy="139" r="83" fill="none" stroke="#54717b"/><g class="ui-icon" transform="translate(1133 128) scale(0.9166666666666666)" fill="none" stroke="#eef5ef" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 8 19-8-5-8 5z"/></g><text x="1217" y="52" fill="#86e2ce" font-size="12" font-weight="700" text-anchor="end">N ↗</text><text x="1060" y="246" fill="#eef5ef" font-size="13" font-weight="400" text-anchor="start" data-max-width="168">광산 · 탐험한 구간</text><rect x="1056" y="254" width="115" height="31" rx="4" fill="#0b1720" /><rect x="1060" y="257" width="28" height="25" rx="4" fill="#10242d" stroke="#54717b"/><text x="1074.0" y="274" fill="#eef5ef" font-size="12" font-weight="700" text-anchor="middle" data-max-width="22">M</text><text x="1097" y="275" fill="#b8cdcf" font-size="13" font-weight="400" text-anchor="start">전체 지도</text><g transform="translate(0 -422)"><g class="panel-fill"><rect x="32" y="636" width="300" height="132" rx="8" fill="#0b1720" /></g><g class="panel-border"><rect x="32.5" y="636.5" width="299" height="131" rx="8" fill="none" stroke="#54717b"/><path d="M48 637H78" stroke="#86e2ce" stroke-width="3"/></g><g class="ui-icon" transform="translate(50 654) scale(0.9166666666666666)" fill="none" stroke="#86e2ce" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></g><text x="83" y="672" fill="#b8cdcf" font-size="13" font-weight="400" text-anchor="start">체력</text><text x="262" y="674" fill="#86e2ce" font-size="26" font-weight="700" text-anchor="end">86</text><text x="312" y="672" fill="#b8cdcf" font-size="13" font-weight="400" text-anchor="end">/ 100</text><rect x="52" y="690" width="260" height="6" rx="3.0" fill="#354b54" /><rect x="52" y="690" width="223.6" height="6" rx="3.0" fill="#86e2ce" /><g class="ui-icon" transform="translate(52 715) scale(1.0)" fill="none" stroke="#86e2ce" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h17v6H10l-2 7H4l2-9H3zM15 7v4M11 12v3h3v-3"/></g><text x="86" y="731" fill="#eef5ef" font-size="14" font-weight="400" text-anchor="start">권총</text><text x="312" y="734" fill="#eef5ef" font-size="22" font-weight="700" text-anchor="end">08 / 12</text><text x="86" y="752" fill="#b8cdcf" font-size="12" font-weight="400" text-anchor="start" data-max-width="228">R 재장전 · 예비 탄창 무제한</text></g><g class="panel-fill"><rect x="208" y="406" width="864" height="338" rx="8" fill="#0b1720" /></g><g class="panel-border"><rect x="208.5" y="406.5" width="863" height="337" rx="8" fill="none" stroke="#54717b"/><path d="M224 407H254" stroke="#9bcafb" stroke-width="3"/></g><text x="228" y="439" fill="#9bcafb" font-size="17" font-weight="700" text-anchor="start" data-max-width="824">수신 기록 / 안전한 곳에서 계속 읽을 수 있습니다.</text><g class="ui-icon" transform="translate(232 466) scale(1.0)" fill="none" stroke="#9bcafb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14v12H5zM8 6l10-4M8 13h3M8 17h3"/><circle cx="16" cy="15" r="1.5"/></g><text x="270" y="485" fill="#eef5ef" font-size="18" font-weight="700" text-anchor="start" data-max-width="650">헤일로 외곽 수신망 담당자 · 리아</text><rect x="865" y="459" width="183" height="28" rx="4" fill="#10242d" /><text x="877" y="478" fill="#9bcafb" font-size="13" font-weight="700" text-anchor="start" data-max-width="163">무전 · 전투 계속</text><text x="232" y="530" fill="#eef5ef" font-size="18" font-weight="400" text-anchor="start" data-max-width="816">신호는 관문 N-0에서 왔어. 하지만 외곽 설비 N-0/17의 기록과는 달라.</text><text x="232" y="562" fill="#eef5ef" font-size="18" font-weight="400" text-anchor="start" data-max-width="816">둘을 같은 장소로 보고 조사하면 안 돼. 먼저 발전기의 수신 기록을 확인하자.</text><text x="232" y="594" fill="#eef5ef" font-size="18" font-weight="400" text-anchor="start" data-max-width="816">확인하지 못한 내용은 조사 기록에 추정으로 남겨 둘게.</text><rect x="232" y="610" width="816" height="46" rx="5" fill="#203c46" /><rect x="232" y="610" width="3" height="46" rx="0" fill="#86e2ce" /><g class="ui-icon" transform="translate(244 622) scale(0.875)" fill="none" stroke="#86e2ce" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m8 4 8 8-8 8"/></g><text x="276" y="639" fill="#86e2ce" font-size="15" font-weight="700" text-anchor="start" data-max-width="722">기록을 먼저 확인한다</text><text x="1034" y="639" fill="#86e2ce" font-size="13" font-weight="400" text-anchor="end">1</text><text x="250" y="683" fill="#8d9fa5" font-size="15" font-weight="400" text-anchor="start" data-max-width="790">2  지금은 답할 수 없다 · 안전한 곳에서 선택</text><text x="232" y="723" fill="#b8cdcf" font-size="13" font-weight="400" text-anchor="start">04 / 04</text><rect x="702" y="699" width="91" height="31" rx="4" fill="#0b1720" /><rect x="706" y="702" width="43" height="25" rx="4" fill="#10242d" stroke="#54717b"/><text x="727.5" y="719" fill="#eef5ef" font-size="12" font-weight="700" text-anchor="middle" data-max-width="37">1–2</text><text x="758" y="720" fill="#b8cdcf" font-size="13" font-weight="400" text-anchor="start">선택</text><rect x="845" y="699" width="145" height="31" rx="4" fill="#0b1720" /><rect x="849" y="702" width="97" height="25" rx="4" fill="#10242d" stroke="#54717b"/><text x="897.5" y="719" fill="#eef5ef" font-size="12" font-weight="700" text-anchor="middle" data-max-width="91">E / Enter</text><text x="955" y="720" fill="#b8cdcf" font-size="13" font-weight="400" text-anchor="start">확정</text></svg>